server:
  port: 8086

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/my_cloud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: fyf58333
  application:
    name: mycloud-album-service
  servlet:
    multipart:
      # 单文件上限，与 mycloud.album.max-file-size 保持一致
      max-file-size: 10MB
      max-request-size: 12MB
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: false          # 本地联调：暂未安装 Nacos，关闭服务发现（装好 Nacos 后改为 true）

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.fyf.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 相册配置
mycloud:
  album:
    # 照片落盘目录（不存在会自动创建），Windows 也可以写 D:/myCloud/uploads/album
    storage-path: ${user.home}/myCloud/uploads/album
    # 对外访问前缀，网关对该前缀放行（浏览器 <img> 无法带 token）
    url-prefix: /album/file
    allowed-extensions: jpg,jpeg,png,gif,webp,bmp
    max-file-size: 10485760
