server:
  port: 8080
spring:
  application:
    name: mycloud-gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: false          # 本地联调：暂未安装 Nacos，关闭服务发现（装好 Nacos 后改为 true）
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      routes:
        - id: mycloud-user-service
          # uri: lb://mycloud-user-service        # 装了 Nacos 并开启服务发现后改回这行
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0
        - id: mycloud-message-service
          # uri: lb://mycloud-message-service     # 装了 Nacos 并开启服务发现后改回这行
          uri: http://localhost:8082
          predicates:
            - Path=/message/**
          filters:
            - StripPrefix=0
        - id: mycloud-note-service
          # uri: lb://mycloud-note-service        # 装了 Nacos 并开启服务发现后改回这行
          uri: http://localhost:8083
          predicates:
            - Path=/note/**
          filters:
            - StripPrefix=0
        - id: mycloud-diary-service
          # uri: lb://mycloud-diary-service       # 装了 Nacos 并开启服务发现后改回这行
          uri: http://localhost:8084
          predicates:
            - Path=/diary/**
          filters:
            - StripPrefix=0
        - id: mycloud-album-service
          # uri: lb://mycloud-album-service       # 装了 Nacos 并开启服务发现后改回这行
          uri: http://localhost:8086
          predicates:
            - Path=/album/**
          filters:
            - StripPrefix=0
        - id: mycloud-todo-service
          # uri: lb://mycloud-todo-service        # 装了 Nacos 并开启服务发现后改回这行
          uri: http://localhost:8085
          predicates:
            - Path=/todo/**
          filters:
            - StripPrefix=0
        - id: mycloud-file-service
          # uri: lb://mycloud-file-service        # 装了 Nacos 并开启服务发现后改回这行
          uri: http://localhost:8087
          predicates:
            - Path=/file/**
          filters:
            - StripPrefix=0
        - id: mycloud-song-service
          # uri: lb://mycloud-song-service        # 装了 Nacos 并开启服务发现后改回这行
          uri: http://localhost:8088
          predicates:
            - Path=/song/**
          filters:
            - StripPrefix=0

