<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>笔记本 · myCloud</title>
  <link rel="stylesheet" href="css/base.css?v=20261128e">
  <link rel="stylesheet" href="css/layout.css?v=20261128e">
</head>
<body>

<header class="topbar" id="topbar"></header>

<main class="container">
  <div class="page-head">
    <div>
      <h3 class="page-title">笔记本</h3>
      <p class="page-desc">
        对应接口：<code>/note</code>（列表 / 新建）、<code>/note/{noteId}</code>（查看 / 修改）、
        <code>/note/group</code>（新建分组）、<code>/note/{noteId}/group?typeId=</code>（分组归类）、
        <code>/note/rm/{noteId}</code>（删除）
      </p>
    </div>
    <button class="btn btn-primary" id="btnNewNote" type="button">+ 新建笔记</button>
  </div>

  <div class="split-layout">
    <!-- 分组 -->
    <aside class="card">
      <div class="card-head">
        <span>分组</span>
        <button class="btn-text btn-sm" id="btnNewGroup" type="button">+ 新建</button>
      </div>
      <div class="card-body" style="padding:10px">
        <div id="groupList"></div>
      </div>
    </aside>

    <!-- 笔记列表 -->
    <section class="card">
      <div class="card-head">
        <span id="noteTitle">全部笔记</span>
        <button class="btn btn-ghost btn-sm" id="btnRefresh" type="button">刷新</button>
      </div>
      <div class="card-body">
        <div id="noteList"></div>
        <div class="load-more" id="loadMoreWrap"></div>
      </div>
    </section>
  </div>
</main>

<script src="js/config.js?v=20261128e"></script>
<script src="js/ui.js?v=20261128e"></script>
<script src="js/request.js?v=20261128e"></script>
<script src="js/mock.js?v=20261128e"></script>
<script src="js/auth.js?v=20261128e"></script>
<script src="js/pages/note.js?v=20261128e"></script>
</body>
</html>
