<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>相册 · myCloud</title>
  <link rel="stylesheet" href="css/base.css?v=20261128f">
  <link rel="stylesheet" href="css/layout.css?v=20261128f">
</head>
<body>

<header class="topbar" id="topbar"></header>

<main class="container">
  <div class="page-head">
    <div>
      <h3 class="page-title">相册</h3>
      <p class="page-desc">
        对应接口：<code>/album</code>（列表 / 上传，multipart/form-data）、
        <code>/album/{photoId}</code>（查看）、<code>/album/rm/{photoId}</code>（删除）
      </p>
    </div>
    <button class="btn btn-primary" id="btnUpload" type="button">+ 上传照片</button>
  </div>

  <section class="card">
    <div class="card-head">
      <span id="albumTitle">照片墙</span>
      <button class="btn btn-ghost btn-sm" id="btnRefresh" type="button">刷新</button>
    </div>
    <div class="card-body">
      <div class="photo-grid" id="photoGrid"></div>
      <div class="load-more" id="loadMoreWrap"></div>
    </div>
  </section>
</main>

<script src="js/config.js?v=20261128f"></script>
<script src="js/ui.js?v=20261128f"></script>
<script src="js/request.js?v=20261128f"></script>
<script src="js/mock.js?v=20261128f"></script>
<script src="js/auth.js?v=20261128f"></script>
<script src="js/pages/album.js?v=20261128f"></script>
</body>
</html>
