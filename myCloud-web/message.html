<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>留言板 · myCloud</title>
  <link rel="stylesheet" href="css/base.css?v=20261128f">
  <link rel="stylesheet" href="css/layout.css?v=20261128f">
</head>
<body>

<header class="topbar" id="topbar"></header>

<main class="container container-narrow">
  <div class="page-head">
    <div>
      <h3 class="page-title">留言板</h3>
      <p class="page-desc">登录后可发布留言，支持游标分页加载与删除（软删除，status 置为已删除）。</p>
    </div>
  </div>

  <!-- 发布留言 -->
  <section class="card">
    <div class="card-head"><span>发布留言</span></div>
    <div class="card-body">
      <textarea id="messageInput" class="textarea" rows="3" maxlength="500"
                placeholder="说点什么吧…（最多 500 字）"></textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
        <span class="text-sub" style="font-size:12px"><span id="charCount">0</span>/500</span>
        <button class="btn btn-primary" id="btnSend" type="button">发布</button>
      </div>
    </div>
  </section>

  <!-- 留言列表 -->
  <section class="card">
    <div class="card-head">
      <span id="listTitle">全部留言</span>
      <div style="display:flex;gap:8px;align-items:center">
        <input class="input" id="filterUserId" placeholder="按用户ID筛选" inputmode="numeric"
               style="width:120px;padding:5px 8px">
        <button class="btn btn-ghost btn-sm" id="btnFilter" type="button">筛选</button>
        <button class="btn btn-ghost btn-sm" id="btnRefresh" type="button">刷新</button>
      </div>
    </div>
    <div class="card-body">
      <div id="messageList"></div>
      <div class="load-more" id="loadMoreWrap"></div>
    </div>
  </section>
</main>

<script src="js/config.js?v=20261128f"></script>
<script src="js/ui.js?v=20261128f"></script>
<script src="js/request.js?v=20261128f"></script>
<script src="js/auth.js?v=20261128f"></script>
<script src="js/pages/message.js?v=20261128f"></script>
</body>
</html>
